[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "BLE"]
ignore = [
    "B008",   # FastAPI's Depends(...) in a default argument is the documented idiom, not a bug
    "BLE001", # blind except Exception is intentional at LLM-output-parsing and infra-fallback boundaries
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F403"]  # `from app.models import *` registers every model on Base.metadata for autogenerate
